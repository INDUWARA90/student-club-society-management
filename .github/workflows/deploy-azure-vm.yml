name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-vm-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "=== System Diagnostic Info ==="
            echo "SSH User: $(whoami)"
            echo "User Home: $HOME"
            echo "Current Directory: $(pwd)"

            TARGET_DIR="$HOME/student-club-society-management"

            echo "=== Step 1: Locating or Cloning Repository ==="
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Repository not found at $TARGET_DIR. Cloning from GitHub..."
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "Working directory: $(pwd)"

            echo "=== Step 2: Fetching Latest Code ==="
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch origin main
            git reset --hard origin/main

            echo "=== Step 3: Checking Environment File ==="
            if [ ! -f .env ]; then
              echo "Notice: .env not found. Creating default configuration from .env.example..."
              cp .env.example .env
              RANDOM_SECRET=$(openssl rand -hex 32 2>/dev/null || echo "default-long-secret-key-12345678901234567890")
              sed -i "s|JWT_SECRET=.*|JWT_SECRET=${RANDOM_SECRET}|" .env
              sed -i "s|MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=RootPass_$(openssl rand -hex 6)!|" .env
              sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=DbPass_$(openssl rand -hex 6)!|" .env
              sed -i "s|FRONTEND_URL=.*|FRONTEND_URL=http://${{ secrets.AZURE_VM_HOST }}:8080|" .env
              sed -i "s|VITE_API_BASE_URL=.*|VITE_API_BASE_URL=http://${{ secrets.AZURE_VM_HOST }}:5000/api|" .env
              echo ".env configured with VM host and secure secrets."
            fi

            echo "=== Step 4: Ensuring Docker and Swap are Ready ==="
            # Ensure swap space exists to prevent out-of-memory errors during build
            if [ ! -f /swapfile ]; then
              echo "Creating 2GB swap file to prevent build OOM errors..."
              sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
            fi

            # Install Docker and Compose if not yet installed
            if ! command -v docker &> /dev/null; then
              echo "Docker is not installed. Installing Docker and Compose..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io docker-compose-v2
              sudo systemctl enable --now docker
              sudo usermod -aG docker "$USER" || true
            fi

            # Check whether docker command needs sudo in current session
            DOCKER_CMD="docker compose"
            if ! docker ps > /dev/null 2>&1; then
              if sudo docker ps > /dev/null 2>&1; then
                DOCKER_CMD="sudo docker compose"
              fi
            fi
            echo "Using Docker command: $DOCKER_CMD"

            echo "=== Step 5: Rebuilding and Starting Containers ==="
            $DOCKER_CMD up -d --build

            echo "=== Step 6: Cleaning Unused Docker Images ==="
            $DOCKER_CMD image prune -f

            echo "=== Step 7: Verifying Backend Health ==="
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:5000/api/health > /dev/null 2>&1; then
                echo "SUCCESS: Backend is healthy and responding!"
                $DOCKER_CMD ps
                exit 0
              fi
              echo "Waiting for backend to report healthy (attempt $i/30)..."
              sleep 5
            done

            echo "ERROR: Backend health check timed out."
            $DOCKER_CMD logs --tail=50 backend || true
            exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Azure VM Deployment Summary"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
