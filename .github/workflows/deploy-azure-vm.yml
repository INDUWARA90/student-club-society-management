name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-vm-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "=== System Diagnostic Info ==="
            echo "SSH User: $(whoami)"
            echo "User Home: $HOME"
            echo "Current Directory: $(pwd)"

            TARGET_DIR="$HOME/student-club-society-management"

            echo "=== Step 1: Locating or Cloning Repository ==="
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Repository not found at $TARGET_DIR. Cloning from GitHub..."
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "Working directory: $(pwd)"

            echo "=== Step 2: Fetching Latest Code ==="
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch origin main
            git reset --hard origin/main

            echo "=== Step 3: Checking Environment File ==="
            if [ ! -f .env ]; then
              echo "Notice: .env not found. Creating default configuration from .env.example..."
              cp .env.example .env
              RANDOM_SECRET=$(openssl rand -hex 32 2>/dev/null || echo "default-long-secret-key-12345678901234567890")
              sed -i "s|JWT_SECRET=.*|JWT_SECRET=${RANDOM_SECRET}|" .env
              sed -i "s|MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=RootPass_$(openssl rand -hex 6)!|" .env
              sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=DbPass_$(openssl rand -hex 6)!|" .env
              sed -i "s|FRONTEND_URL=.*|FRONTEND_URL=http://${{ secrets.AZURE_VM_HOST }}:8080|" .env
              sed -i "s|VITE_API_BASE_URL=.*|VITE_API_BASE_URL=http://${{ secrets.AZURE_VM_HOST }}:5000/api|" .env
              echo ".env configured with VM host and secure secrets."
            fi

            echo "=== Step 4: Rebuilding and Restarting Containers ==="
            docker compose up -d --build

            echo "=== Step 5: Cleaning Unused Docker Images ==="
            docker image prune -f

            echo "=== Step 6: Verifying Backend Health ==="
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:5000/api/health > /dev/null 2>&1; then
                echo "SUCCESS: Backend is healthy and responding!"
                docker compose ps
                exit 0
              fi
              echo "Waiting for backend to report healthy (attempt $i/30)..."
              sleep 5
            done

            echo "ERROR: Backend health check timed out."
            docker compose logs --tail=50 backend || true
            exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Azure VM Deployment Summary"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
