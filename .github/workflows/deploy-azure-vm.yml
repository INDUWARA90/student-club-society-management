name: Build and Deploy Containers to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-vm-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------------
  # Job 1: Build Docker images in GitHub cloud runner and push to GHCR
  # ---------------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=ghcr.io/${REPO_LOWER}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${REPO_LOWER}-frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:latest
            ${{ steps.meta.outputs.backend_image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:latest
            ${{ steps.meta.outputs.frontend_image }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=http://${{ secrets.AZURE_VM_HOST }}:5000/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------------
  # Job 2: Deploy to Azure VM (Pull pre-built containers & restart)
  # ---------------------------------------------------------------------------------
  deploy:
    name: Deploy Containers to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e

            TARGET_DIR="$HOME/student-club-society-management"
            mkdir -p "$TARGET_DIR/scripts" "$TARGET_DIR/backups"
            cd "$TARGET_DIR"

            echo "=== Step 1: Logging in to GHCR on the VM ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || \
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            DOCKER_CMD="docker compose"
            if ! docker ps > /dev/null 2>&1; then
              if sudo docker ps > /dev/null 2>&1; then
                DOCKER_CMD="sudo docker compose"
              fi
            fi

            echo "=== Step 2: Syncing production compose file ==="
            if [ -d ".git" ]; then
              git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "=== Step 3: Pulling pre-built container images from GHCR ==="
            export IMAGE_BACKEND="${{ needs.build-and-push.outputs.backend_image }}:latest"
            export IMAGE_FRONTEND="${{ needs.build-and-push.outputs.frontend_image }}:latest"

            $DOCKER_CMD -f docker-compose.prod.yml pull

            echo "=== Step 4: Starting containers with pre-built images ==="
            $DOCKER_CMD -f docker-compose.prod.yml up -d

            echo "=== Step 5: Cleaning unused old images ==="
            docker image prune -f 2>/dev/null || sudo docker image prune -f 2>/dev/null || true

            echo "=== Step 6: Verifying backend health ==="
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:5000/api/health > /dev/null 2>&1; then
                echo "SUCCESS: Backend is healthy and responding!"
                $DOCKER_CMD -f docker-compose.prod.yml ps
                exit 0
              fi
              echo "Waiting for backend to report healthy (attempt $i/30)..."
              sleep 5
            done

            echo "ERROR: Backend health check timed out."
            $DOCKER_CMD -f docker-compose.prod.yml logs --tail=50 backend || true
            exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Pure Container Deployment Summary (GHCR)"
            echo "- Backend Image: \`${{ needs.build-and-push.outputs.backend_image }}:latest\`"
            echo "- Frontend Image: \`${{ needs.build-and-push.outputs.frontend_image }}:latest\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
