name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-vm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -eo pipefail

            echo "=== System Diagnostic Info ==="
            echo "SSH User: $(whoami)"
            echo "User Home: $HOME"
            echo "Current Dir: $(pwd)"
            echo "Home contents:"
            ls -la "$HOME" || true

            echo "=== Step 1: Locating application repository ==="
            APP_DIR=""

            # Check if currently inside the repo
            if [ -f "./docker-compose.yml" ] && [ -d "./.git" ]; then
              APP_DIR="$(pwd)"
            # Check standard path in $HOME
            elif [ -d "$HOME/student-club-society-management" ]; then
              APP_DIR="$HOME/student-club-society-management"
            # Check /home/azureuser
            elif [ -d "/home/azureuser/student-club-society-management" ]; then
              APP_DIR="/home/azureuser/student-club-society-management"
            else
              # Search for docker-compose.yml anywhere in $HOME
              FOUND_COMPOSE=$(find "$HOME" -maxdepth 3 -name "docker-compose.yml" 2>/dev/null | head -n 1 || true)
              if [ -n "$FOUND_COMPOSE" ]; then
                APP_DIR="$(dirname "$FOUND_COMPOSE")"
              fi
            fi

            # If still not found, clone it automatically
            if [ -z "$APP_DIR" ]; then
              echo "Repository not found on VM. Auto-cloning into $HOME/student-club-society-management..."
              git clone https://github.com/INDUWARA90/student-club-society-management.git "$HOME/student-club-society-management"
              APP_DIR="$HOME/student-club-society-management"
            fi

            cd "$APP_DIR"
            echo "Target application directory: $(pwd)"

            # Ensure .env exists so docker compose doesn't fail
            if [ ! -f .env ]; then
              echo "Notice: .env not found. Creating default from .env.example..."
              cp .env.example .env
              RANDOM_SECRET=$(openssl rand -hex 32 2>/dev/null || echo "default-long-secret-key-12345678901234567890")
              sed -i "s|JWT_SECRET=.*|JWT_SECRET=${RANDOM_SECRET}|" .env
              sed -i "s|MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=rootpassword123!|" .env
              sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=dbpassword123!|" .env
            fi

            echo "=== Step 2: Fetching latest changes from main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Step 3: Rebuilding and restarting containers ==="
            docker compose up -d --build

            echo "=== Step 4: Cleaning dangling Docker images ==="
            docker image prune -f

            echo "=== Step 5: Checking backend health ==="
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:5000/api/health > /dev/null 2>&1; then
                echo "SUCCESS: Backend is healthy and responding!"
                docker compose ps
                exit 0
              fi
              echo "Waiting for backend to become healthy (attempt $i/30)..."
              sleep 5
            done

            echo "ERROR: Backend did not report healthy within timeout."
            docker compose logs --tail=50 backend || true
            exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Azure VM Deployment Summary"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
