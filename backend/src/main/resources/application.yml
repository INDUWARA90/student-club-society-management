server:
  # Hosts such as Render inject PORT; locally and in docker-compose it stays 5000.
  port: ${PORT:5000}

spring:
  application:
    name: backend
  profiles:
    active: dev
  # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
  # Databases created before Flyway (by ddl-auto=update) are baselined at V1 and receive V2 onwards.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"

# The deployed commit, reported by /api/health so a pipeline can confirm which version is live. The container entrypoint
# also sets it; this covers running the jar directly on a host that provides the commit (e.g. Render).
app:
  version: ${APP_VERSION:${RENDER_GIT_COMMIT:unknown}}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/club_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  frontend-url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Local dev conveniences: demo data on, no SMTP needed to use the app.
  seed-demo-data: ${SEED_DEMO_DATA:true}
  require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
  trust-forwarded-headers: false
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema, so Hibernate never alters it; validate fails fast if entities and schema drift.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  frontend-url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # Production safety: no demo accounts, verified emails required. Create the first admin with BOOTSTRAP_ADMIN_*.
  seed-demo-data: ${SEED_DEMO_DATA:false}
  require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
  # Only enable behind a proxy that overwrites X-Forwarded-For (e.g. Render); otherwise the header is spoofable.
  trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
