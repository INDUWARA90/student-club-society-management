services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: club_management
      POSTGRES_USER: club_user
      POSTGRES_PASSWORD: club_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club_user -d club_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/club_management
      SPRING_DATASOURCE_USERNAME: club_user
      SPRING_DATASOURCE_PASSWORD: club_password
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
