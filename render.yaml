# Render Blueprint for the backend API (https://render.com/docs/blueprint-spec).
# Create it once from the Render dashboard: New > Blueprint > pick this repository.
#
# Deploys are triggered by the "Backend CI/CD" GitHub workflow (after tests pass) through this service's deploy hook,
# so auto-deploy is off here — Render never builds a commit that hasn't passed CI. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: club-society-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: false
    # Render only routes traffic to a new version once this returns 200 (i.e. the app is up AND can reach its
    # database), and keeps the previous version serving until then — a broken release never replaces a good one.
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # --- database (MySQL; Render has no managed MySQL, so use an external one — see docs/DEPLOYMENT.md) ---
      - key: DATABASE_URL          # jdbc:mysql://<host>:<port>/<db>?useSSL=true&serverTimezone=UTC
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # --- security ---
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL          # e.g. https://club-society.vercel.app  (used in email links and QR codes)
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # same origin(s) as the frontend, comma-separated
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: TRUST_FORWARDED_HEADERS   # Render's proxy overwrites X-Forwarded-For, so per-IP rate limiting can trust it
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      # First-run only: creates the initial Super Admin when none exists (password 12+ characters).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # --- email (Gmail app password, or any SMTP provider) ---
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
